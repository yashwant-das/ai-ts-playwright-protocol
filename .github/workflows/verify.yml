name: Verify

# Static checks only. The Playwright suite runs locally (`npm test`,
# `npm run task <TASK_ID>`): SPP tasks are driven by an AI assistant on the
# developer's machine, so CI does not install browsers or run tests.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check tests load (no browser, no run)
        run: npx playwright test --list
